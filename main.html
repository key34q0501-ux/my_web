<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>홈 화면</title>
    <style>
        body {
            display: flex;
            justify-content: center; /* 가로위치 */
            align-items: flex-start; /* 세로위치 */
            height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Arial', sans-serif;
            margin: 10px;
            padding-top: 50px;
        }
        .welcome-box {
            background-color: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 { 
            color: #17921f; 
            font-size: 32px;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3a88e7;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .modal-btns { 
            display: flex; 
            gap: 15px; 
            justify-content: center; 
            margin-top: 20px;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 280px;
            animation: modalShow 0.3s ease-out;
        }
        @keyframes modalShow {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            background-color: #333;
            color: #eee;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover { 
            filter: brightness(0.9); 
            transform: scale(1.05) translateY(-2px);
        }
        /* 수학 문제 버튼은 초록색으로 포인트를 줬어요 */
        #mathquiz-btn { background-color: #d25757; }    /* # -> id */
        #drama-btn { background-color: orange;}
        #jjangu-btn { background-color: rgb(225, 225, 58);}
        #workspace-btn { background-color: rgb(139, 212, 30); }
        #logout-btn { background-color: #555; }
        #confirm-btn { background-color: #4082ED;}
        #cancel-btn { background-color: #ec3f3f;}
    </style>
</head>
<body>
    <div class="welcome-box">
        <h1 id="user-name-display"></h1>
        <div id="loader" class="loader"></div>
        <p>당신만을 위한 놀이방입니다.</p>

        <div class="btn-group">
            <button id="mathquiz-btn">수학 문제 풀기</button>
            <button id="drama-btn">드라마 명대사 월드컵</button>
            <button id="jjangu-btn">짱구 명대사 월드컵</button>
            <button id="workspace-btn">관리자 공간</button>
            <button id="logout-btn">로그아웃</button>
        </div>
    </div>
    <div id="pw-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="lock-icon">🔒</div>
            <h3>관리자 인증</h3>
            <input type="password" id="modal-pw-input" placeholder="비밀번호 입력">
            <div class="modal-btns">
                <button id="confirm-btn">확인</button>
                <button id="cancel-btn">취소</button>
            </div>
        </div>
    </div>
    <script>
        window.onload = function() {
            const loggedInUser = localStorage.getItem('currentId');

            if (loggedInUser) {
                document.getElementById('user-name-display').textContent = loggedInUser + "님, 환영합니다!";
            } else {
                alert("로그인이 필요합니다!");
                location.href = 'index.html';
            }
        };

        // 수학 문제 풀기 버튼 클릭 시
        document.getElementById('mathquiz-btn').addEventListener('click', function() {
            window.location.href = 'quiz.html';
        });
        document.getElementById('drama-btn').addEventListener('click', function() {
            window.location.href = 'drama.html'
        })
        document.getElementById('jjangu-btn').addEventListener('click', function() {
            window.location.href = 'jjangu-worldcup.html'
        })
        const modal = document.getElementById('pw-modal');
        const pwInput = document.getElementById('modal-pw-input');
        document.getElementById('workspace-btn').addEventListener('click', function() {
            modal.style.display = 'flex';
            pwInput.value = ""
            pwInput.focus();
        });
        document.getElementById('cancel-btn').onclick = () => {
            modal.style.display = 'none'
        };
        document.getElementById('confirm-btn').onclick = function () {
            const pw = pwInput.value;
            if (btoa(pw) === "MjAyMA==") {
                modal.style.display = 'none';

                const welcomeTitle = document.getElementById('user-name-display');
                const loader = document.getElementById('loader');
                const btnGroup = document.querySelector('.btn-group');
                welcomeTitle.textContent = "승범님, 환영합니다! 잠시 후 이동합니다...";
                welcomeTitle.style.color = "#3a88e7";

                loader.style.display = "block";
                btnGroup.style.display = "none";

                setTimeout(function() {
                    window.location.href = 'workspace.html';
                }, 2000);
            } else {
                alert("비밀번호가 틀렸습니다!");
                pwInput.focus();
            }
        };
        // 로그아웃 버튼 클릭 시
        document.getElementById('logout-btn').addEventListener('click', function() {
            localStorage.removeItem('currentId');
            location.href = 'index.html';
        });
    </script>
</body>
</html>
